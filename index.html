<!doctype html>

  <title>Links Roblox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 350px;
      padding: 14px 20px;
      background: #222;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      text-decoration: none;
      color: #fff;
    }
    .card:hover {
      transform: scale(1.03);
      background: #333;
    }
    .card img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }
    .card span {
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
